<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --sb: #111116;
        --row: #15151b;
        --rowa: #1d1d25;
        --line: #2a2a35;
        --fg: #f4f4f5;
        --mut: #a1a1aa;
        --dim: #71717a;
        --need: #fbbf24;
        --block: #fb7185;
        --run: #22d3ee;
        --ready: #34d399;
        --idle: #52525b;
        --pLC: #818cf8;
        --pAI: #f472b6;
        --pGOO: #a3e635;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-sans, "Geist", system-ui, sans-serif);
        color: var(--foreground, var(--fg));
      }
      .sheet {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 20px;
      }
      .opt h3 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .opt h3 b {
        color: var(--primary, #d92626);
        margin-right: 6px;
      }
      .opt p.wins {
        margin: 0 0 10px;
        font-size: 12.5px;
        color: var(--muted-foreground, var(--mut));
        line-height: 1.45;
        min-height: 36px;
      }
      .opt .tag {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 999px;
        background: rgb(217 38 38 / 16%);
        color: #fca5a5;
        margin-left: 6px;
        vertical-align: 2px;
      }
      .panel {
        background: var(--sb);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 8px;
        height: 640px;
        overflow: hidden;
        position: relative;
        color: var(--fg);
        font-size: 13px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 6px 10px;
      }
      .search {
        flex: 1;
        background: var(--row);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 9px;
        color: var(--dim);
        font-size: 12.5px;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--row);
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 12px;
        color: var(--mut);
        white-space: nowrap;
      }
      .btn.on {
        color: var(--fg);
        border-color: #3a3a48;
      }
      .chips {
        display: flex;
        gap: 5px;
        padding: 0 6px 10px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 11.5px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--mut);
      }
      .chip.on {
        background: var(--rowa);
        color: var(--fg);
        border-color: #3a3a48;
      }
      .chip i {
        font-style: normal;
        color: var(--dim);
        margin-left: 3px;
      }
      .sec {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 8px 5px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--mut);
      }
      .sec .n {
        color: var(--dim);
        font-weight: 500;
      }
      .sec .rule {
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .sec .car {
        color: var(--dim);
        font-size: 10px;
      }
      .row {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 8px;
        align-items: start;
        padding: 7px 8px;
        border-radius: 8px;
      }
      .row.sel {
        background: var(--rowa);
      }
      .row .t {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 18px;
      }
      .row.read .t {
        color: #d4d4d8;
        font-weight: 400;
      }
      .row .meta {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
      }
      .row .meta .why {
        color: var(--mut);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .time {
        font-size: 11.5px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        line-height: 18px;
        text-align: right;
      }
      .compact .row {
        padding: 5px 8px;
        grid-template-columns: 14px auto 1fr auto;
        align-items: center;
      }
      .compact .row .t {
        font-size: 12.5px;
      }
      /* status glyphs: shape + color, never color alone */
      .s {
        width: 12px;
        height: 12px;
        margin-top: 3px;
        border-radius: 50%;
        display: inline-block;
      }
      .compact .s {
        margin-top: 0;
      }
      .s.need {
        background: var(--need);
        box-shadow: 0 0 0 3px rgb(251 191 36 / 18%);
      }
      .s.block {
        border-radius: 3px;
        background: var(--block);
      }
      .s.run {
        border: 2px solid var(--run);
        border-right-color: transparent;
        animation: spin 1.1s linear infinite;
      }
      .s.ready {
        background: var(--ready);
      }
      .s.idle {
        border: 1.5px solid var(--idle);
      }
      .s.woke {
        border: 2px solid var(--need);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .s.run {
          animation: none;
        }
      }
      .pj {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .pj::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: var(--c);
      }
      .mono {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        display: inline-grid;
        place-items: center;
        font-size: 9.5px;
        font-weight: 700;
        color: #111116;
        background: var(--c);
      }
      .proj {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 8px 4px;
        font-size: 12.5px;
        font-weight: 600;
      }
      .proj .n {
        color: var(--dim);
        font-weight: 500;
        font-size: 11.5px;
        margin-left: auto;
      }
      .proj .pend {
        font-size: 10.5px;
        padding: 0 6px;
        border-radius: 999px;
        background: rgb(251 191 36 / 14%);
        color: var(--need);
        font-weight: 600;
      }
      .indent .row {
        padding-left: 22px;
      }
      .more {
        font-size: 11.5px;
        color: var(--dim);
        padding: 3px 30px 6px;
      }
      .foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 0 0 12px 12px;
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        color: var(--dim);
        border-top: 1px solid var(--line);
        padding: 8px 16px 10px;
        background: var(--sb);
      }
      .pop {
        position: absolute;
        top: 46px;
        right: 10px;
        width: 232px;
        background: #1d1d25;
        border: 1px solid #3a3a48;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 16px 40px rgb(0 0 0 / 55%);
        z-index: 3;
        font-size: 12px;
      }
      .pop .lbl {
        color: var(--dim);
        font-size: 11px;
        margin: 8px 0 4px;
      }
      .pop .lbl:first-child {
        margin-top: 0;
      }
      .seg {
        display: flex;
        background: #111116;
        border-radius: 7px;
        padding: 2px;
        gap: 2px;
      }
      .seg span {
        flex: 1;
        text-align: center;
        padding: 4px 0;
        border-radius: 5px;
        color: var(--mut);
        font-size: 11.5px;
      }
      .seg span.on {
        background: #2a2a35;
        color: var(--fg);
      }
      .tog {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
        color: var(--mut);
      }
      .tog b {
        width: 24px;
        height: 14px;
        border-radius: 999px;
        background: #3a3a48;
        position: relative;
      }
      .tog b::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #a1a1aa;
      }
      .tog b.on {
        background: var(--primary, #d92626);
      }
      .tog b.on::after {
        left: 12px;
        background: #fff;
      }
      .rail {
        position: absolute;
        left: 8px;
        top: 12px;
        bottom: 12px;
        width: 44px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        padding-top: 4px;
      }
      .rail .mono {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        font-size: 12px;
        position: relative;
      }
      .rail .mono.cur {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
      .rail .mono .bd {
        position: absolute;
        right: -4px;
        top: -4px;
        min-width: 15px;
        height: 15px;
        border-radius: 999px;
        background: var(--need);
        color: #111;
        font-size: 9.5px;
        display: grid;
        place-items: center;
        border: 2px solid var(--sb);
      }
      .rail .all {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        color: var(--mut);
        font-size: 11px;
      }
      .railbody {
        margin-left: 52px;
      }
      .legend {
        margin-top: 22px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted-foreground, var(--mut));
      }
      .legend span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="sheet" id="sheet"></div>
    <div class="legend">
      <span><i class="s need"></i>Needs you (input, approval)</span>
      <span><i class="s block"></i>Blocked (usage limit, error)</span>
      <span><i class="s run"></i>Running</span>
      <span><i class="s ready"></i>Finished, not read</span>
      <span><i class="s woke"></i>Back from snooze</span>
      <span><i class="s idle"></i>Idle, read</span>
    </div>
    <script>
      const P = {
        LC: ["Leonidas Code", "--pLC", "LC"],
        AI: ["Leonidas AIOS", "--pAI", "LA"],
        GOO: ["clean-the-goo", "--pGOO", "CG"],
      };
      // Real threads from the current sidebar screenshot.
      const T = [
        {
          id: 1,
          t: "AI Cache Awareness and Alerts",
          p: "LC",
          s: "need",
          why: "Waiting for your answer",
          ago: "7m",
          d: "Today",
          sel: true,
        },
        {
          id: 2,
          t: "Leonidas Onboarding and Dictation",
          p: "LC",
          s: "block",
          why: "Usage limit, resumes 11:40 PM",
          ago: "11h",
          d: "Today",
        },
        {
          id: 3,
          t: "Create Prompts for Better Leonidas UX",
          p: "LC",
          s: "woke",
          why: "Back from snooze",
          ago: "1d",
          d: "Yesterday",
        },
        {
          id: 4,
          t: "Optimize prompts across Leonidas systems",
          p: "LC",
          s: "woke",
          why: "Back from snooze",
          ago: "2d",
          d: "This week",
        },
        {
          id: 5,
          t: "Leonidas health prompt library",
          p: "LC",
          s: "run",
          why: "Using a tool, 10m",
          ago: "now",
          d: "Today",
        },
        {
          id: 6,
          t: "Local Image Generation Lab",
          p: "AI",
          s: "ready",
          why: "Finished, not read",
          ago: "12h",
          d: "Today",
        },
        {
          id: 7,
          t: "$next-action Give me 1 task",
          p: "AI",
          s: "idle",
          why: "Done",
          ago: "14h",
          d: "Today",
        },
        {
          id: 8,
          t: "Source audio pro SFX",
          p: "GOO",
          s: "idle",
          why: "Done",
          ago: "14h",
          d: "Today",
        },
        {
          id: 9,
          t: "Audit Core Spray and Suction Feel",
          p: "GOO",
          s: "idle",
          why: "Done, PR #115",
          ago: "14h",
          d: "Today",
        },
      ];
      const need = (x) => ["need", "block", "woke"].includes(x.s);
      const pj = (k) => `<span class="pj" style="--c:var(${P[k][1]})">${P[k][0]}</span>`;
      const mono = (k) => `<span class="mono" style="--c:var(${P[k][1]})">${P[k][2]}</span>`;
      const row = (
        x,
        o = {},
      ) => `<div class="row ${x.sel ? "sel" : ""} ${x.s === "idle" ? "read" : ""}">
  <i class="s ${x.s}"></i>
  <div style="min-width:0"><div class="t">${x.t}</div>
  <div class="meta">${o.noProj ? "" : pj(x.p) + "<span>·</span>"}<span class="why">${x.why}</span></div></div>
  <div class="time">${x.ago}</div></div>`;
      const crow = (x) =>
        `<div class="row ${x.sel ? "sel" : ""} ${x.s === "idle" ? "read" : ""}"><i class="s ${x.s}"></i>${mono(x.p)}<div class="t">${x.t}</div><div class="time">${x.ago}</div></div>`;
      const sec = (label, n, car = "") =>
        `<div class="sec">${label} <span class="n">${n}</span><span class="rule"></span>${car ? `<span class="car">${car}</span>` : ""}</div>`;
      const byP = (k) => T.filter((x) => x.p === k && !need(x) && x.s !== "run");
      const bar = (extra = "") =>
        `<div class="top"><div class="search">Search chats</div>${extra}</div>`;

      const A = `<div class="panel">${bar('<span class="btn">View</span>')}
  ${sec("Needs you", 3)}${T.filter(need)
    .map((x) => row(x))
    .join("")}
  ${sec("Running", 1)}${T.filter((x) => x.s === "run")
    .map((x) => row(x))
    .join("")}
  <div class="indent">
  <div class="proj">${mono("LC")}Leonidas Code<span class="n">31</span></div><div class="more">Show 31 chats</div>
  <div class="proj">${mono("AI")}Leonidas AIOS<span class="n">48</span></div>${byP("AI")
    .map((x) => row(x, { noProj: true }))
    .join("")}
  <div class="proj">${mono("GOO")}clean-the-goo<span class="n">12</span></div>${byP("GOO")
    .map((x) => row(x, { noProj: true }))
    .join("")}
  </div>
  <div class="foot"><span>Snoozed 2</span><span>Archive 244</span></div></div>`;

      const B = `<div class="panel">${bar('<span class="btn">View</span>')}
  <div class="chips"><span class="chip on">All</span><span class="chip">Needs you<i>3</i></span><span class="chip">Running<i>1</i></span><span class="chip">Unread<i>1</i></span></div>
  ${sec("Needs you", 3)}${T.filter(need)
    .map((x) => row(x))
    .join("")}
  ${sec("Running", 1)}${T.filter((x) => x.s === "run")
    .map((x) => row(x))
    .join("")}
  ${sec("Ready to review", 1)}${T.filter((x) => x.s === "ready")
    .map((x) => row(x))
    .join("")}
  ${sec("Recent", 3)}${T.filter((x) => x.s === "idle")
    .map((x) => row(x))
    .join("")}
  <div class="foot"><span>Snoozed 2</span><span>Archive 244</span></div></div>`;

      const days = ["Today", "Yesterday", "This week"];
      const C = `<div class="panel">${bar('<span class="btn">View</span>')}
  <div class="chips"><span class="chip on">All projects</span><span class="chip">Leonidas Code</span><span class="chip">AIOS</span><span class="chip">+1</span></div>
  ${days
    .map((d) => {
      const xs = T.filter((x) => x.d === d);
      return sec(d, xs.length) + xs.map((x) => row(x)).join("");
    })
    .join("")}
  <div class="foot"><span>Snoozed 2</span><span>Archive 244</span></div></div>`;

      const D = `<div class="panel compact">
  <div class="rail"><span class="all">All</span>
    <span class="mono cur" style="--c:var(--pLC)">LC<span class="bd">3</span></span>
    <span class="mono" style="--c:var(--pAI)">LA</span>
    <span class="mono" style="--c:var(--pGOO)">CG</span></div>
  <div class="railbody">${bar('<span class="btn">View</span>')}
  <div class="proj" style="padding-top:2px">Leonidas Code<span class="n">31 chats</span></div>
  ${sec("Needs you", 3)}${T.filter((x) => x.p === "LC" && need(x))
    .map(crow)
    .join("")}
  ${sec("Running", 1)}${T.filter((x) => x.s === "run")
    .map(crow)
    .join("")}
  ${sec("Earlier", 28)}${["Rebrand pass for settings", "Quota telemetry strip", "Task board celebration toast", "Skill folders in slash menu", "Boot smoke gate", "Fixed-name setup download", "Delegated task usage block"].map((t, i) => crow({ t, p: "LC", s: "idle", ago: ["1d", "1d", "2d", "2d", "3d", "3d", "4d"][i] })).join("")}
  </div>
  <div class="foot" style="left:52px"><span>Snoozed 2</span><span>Archive 244</span></div></div>`;

      const E = `<div class="panel" style="height:auto;padding:16px">  <div class="pop" style="position:static;width:auto;box-shadow:none">
    <div class="lbl">Group by</div><div class="seg"><span class="on">Smart</span><span>Project</span><span>Date</span><span>None</span></div>
    <div class="lbl">Sort</div><div class="seg"><span class="on">Last activity</span><span>Created</span><span>Manual</span></div>
    <div class="lbl">Density</div><div class="seg"><span class="on">Comfy</span><span>Compact</span></div>
    <div class="lbl">Show</div>
    <div class="tog">Project<b class="on"></b></div><div class="tog">Status reason<b class="on"></b></div><div class="tog">Time<b class="on"></b></div><div class="tog">Provider avatar<b></b></div>
  </div>
<p style="margin:12px 2px 0;color:var(--mut);font-size:12px;line-height:1.5">One View button on top of the list. The choice saves per device. A Reset link returns to the default.</p></div>`;
      const opts = [
        [
          "A",
          "Attention first, then projects",
          "Recommended default",
          "Wins when: you run many chats across projects and want what needs you on top, and the rest filed by project. Archive replaces the old Done shelf.",
          A,
        ],
        [
          "B",
          "Status lanes",
          "",
          "Wins when: you mostly work in one project at a time and care about the queue state more than where a chat lives.",
          B,
        ],
        [
          "C",
          "Timeline",
          "",
          'Wins when: you think in time ("the one from yesterday"). Same model as ChatGPT and Claude. Project chips filter the list.',
          C,
        ],
        [
          "D",
          "Project rail, compact rows",
          "",
          "Wins when: you have 5 or more projects. The rail badges show which project needs you. Rows are one line, so more fit.",
          D,
        ],
        [
          "+",
          "View menu (works on every layout)",
          "",
          "Wins when: the default does not fit you. Four small choices change the list without a new layout.",
          E,
        ],
      ];
      document.getElementById("sheet").innerHTML = opts
        .map(
          ([k, h, tag, w, html]) =>
            `<div class="opt"><h3><b>${k}</b>${h}${tag ? `<span class="tag">${tag}</span>` : ""}</h3><p class="wins">${w}</p>${html}</div>`,
        )
        .join("");
    </script>
  </body>
</html>
