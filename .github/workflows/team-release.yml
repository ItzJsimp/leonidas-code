name: Team release

# Development releases stay on 0.x; 1.0.0 is an explicit public launch.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      release_kind:
        description: "Version bump (launch explicitly publishes 1.0.0)"
        type: choice
        default: auto
        options: [auto, patch, minor, major, launch]

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 40
    concurrency:
      group: team-release-build
      cancel-in-progress: true
    outputs:
      version: ${{ steps.release.outputs.version }}
      previous: ${{ steps.release.outputs.previous }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Plan version and patch notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.release_kind || 'auto' }}
        run: node scripts/leonidas-release.ts

      - name: Locate dependency cache
        id: dependencies
        run: echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"

      - name: Restore desktop dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.dependencies.outputs.path }}
          key: desktop-deps-${{ runner.os }}-x64-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/team-release.yml') }}

      - name: Install desktop build dependencies
        run: vp install --frozen-lockfile --filter @t3tools/monorepo --filter @t3tools/desktop... --filter t3... --filter @t3tools/web... --filter @t3tools/scripts...

      - name: Identify Rust toolchain
        id: rust
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore resource monitor
        id: monitor
        uses: actions/cache@v4
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: monitor-${{ runner.os }}-x64-${{ steps.rust.outputs.version }}-${{ hashFiles('native/resource-monitor/Cargo.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/src/**', 'native/resource-monitor/build.rs', 'native/resource-monitor/.cargo/**', '.cargo/**') }}

      # The Rust Scribe engine ships inside the installer (ADR-0074). The cache key
      # covers its sources, so most releases reuse the binary and skip the build.
      - name: Restore Scribe engine
        id: engine
        uses: actions/cache@v4
        with:
          path: |
            services/scribe-engine/target/x86_64-pc-windows-msvc/release/scribe-engine.exe
            services/scribe-engine/target/x86_64-pc-windows-msvc/release/scribe-bench.exe
          key: scribe-engine-${{ runner.os }}-x64-${{ steps.rust.outputs.version }}-${{ hashFiles('services/scribe-engine/Cargo.toml', 'services/scribe-engine/Cargo.lock', 'services/scribe-engine/src/**') }}

      - name: Build Scribe engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path services/scribe-engine/Cargo.toml

      - name: Set release version
        run: node scripts/update-release-package-versions.ts "${{ steps.release.outputs.version }}"

      # Stops a release on a type error or a failed test. Tests cover only the
      # packages that pass on Windows today; provider-core and server still hold
      # Windows-only test failures, so add them once they are green.
      - name: Check types and fast tests
        run: |
          (cd packages/shared && vp run typecheck)
          (cd packages/client-runtime && vp run typecheck && vp test run)
          (cd packages/provider-core && vp run typecheck)
          (cd apps/server && vp run typecheck)
          (cd apps/web && vp run typecheck)
          (cd packages/shared && vp test run src/usageLimits.test.ts src/promptPrediction.test.ts src/harnessReliability.test.ts src/hardwareWatch.test.ts src/turnLedger.test.ts)

      - name: Build JS bundle
        env:
          # Public relay address; turns the in-app feedback button on.
          VITE_LEONIDAS_FEEDBACK_URL: ${{ vars.LEONIDAS_FEEDBACK_URL }}
          # Public PostHog project key (write-only); without it the app sends no usage events.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
        run: vp run build:desktop

      - name: Check the web bundle boots
        run: node scripts/check-web-boot.mjs

      # 0.62.0 bound its port but never answered: boot the built server on a
      # fresh home and send one live orchestration command, fail on a hang.
      - name: Check the server boots and answers
        run: node scripts/smoke.mjs --entry apps/server/dist/bin.mjs

      # ADR-0074 engine budgets (hotkey 50 ms, idle 30 MB, cold start 2 s): a miss
      # stops the release before anything publishes.
      - name: Check the Scribe engine budgets
        run: services/scribe-engine/target/x86_64-pc-windows-msvc/release/scribe-bench.exe --null-audio

      - name: Build Windows installer
        env:
          T3CODE_DESKTOP_REUSE_SCRIBE_ENGINE: "true"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.monitor.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "${{ steps.release.outputs.version }}" --skip-build

      # Per-release benchmark: engine budgets fail the build. App idle RAM (500 MB)
      # and app cold start (2 s) only warn until the repo variable
      # LEONIDAS_ENFORCE_APP_BUDGETS is "true" (set it after the first report is reviewed).
      - name: Fetch benchmark history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern benchmark-history.csv --output benchmark-history.csv --clobber || echo "No earlier benchmark history."

      - name: Benchmark the installer
        env:
          ENFORCE_APP: ${{ vars.LEONIDAS_ENFORCE_APP_BUDGETS == 'true' && '--enforce-app' || '' }}
        run: node scripts/release-benchmark.ts --version "${{ steps.release.outputs.version }}" --installer "release/Leonidas-Code-${{ steps.release.outputs.version }}-x64.exe" --engine-dir services/scribe-engine/target/x86_64-pc-windows-msvc/release --history benchmark-history.csv --out-dir release $ENFORCE_APP

      - name: Save release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/benchmark-history.csv
            release/benchmark-report.md
            notes.md
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish complete release
    needs: windows
    outputs:
      published: ${{ steps.publish.outputs.published }}
    runs-on: ubuntu-latest
    # A newer push may cancel a build, but must never interrupt publication.
    concurrency:
      group: team-release-publish
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts
      - name: Publish if this is still the newest main commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
          EXPECTED_PREVIOUS: ${{ needs.windows.outputs.previous }}
        run: |
          TIP=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth=1 origin main
            if git diff --name-only "$GITHUB_SHA" FETCH_HEAD | grep -qvE '[.]md$'; then
              echo "Superseded by newer app changes; skipping publication."
              exit 0
            fi
            echo "Only documentation changed; publishing this verified app build."
          fi
          STAGE=$(jq -r '.stage' leonidas-release.json)
          FILTER='[.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))][0].tag_name // ""'
          if [ "$STAGE" = "development" ]; then
            FILTER='[.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v0[.][0-9]+[.][0-9]+$"))][0].tag_name // ""'
          fi
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "$FILTER")
          if [ "$EXPECTED_PREVIOUS" != "$PREVIOUS" ]; then
            echo "::error::Release baseline changed during the build. Rerun this workflow to generate the correct version."
            exit 1
          fi
          # Assets are fully uploaded before the release becomes visible to updaters.
          if gh release view "v$VERSION" --json isDraft --jq '.isDraft' > existing-release.txt 2>/dev/null; then
            if [ "$(cat existing-release.txt)" != "true" ]; then
              echo "::error::Refusing to overwrite a published release."
              exit 1
            fi
            gh release edit "v$VERSION" --target "$GITHUB_SHA" --notes-file artifacts/notes.md
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --draft --title "v$VERSION" --notes-file artifacts/notes.md
          fi
          find artifacts -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) -print0 | xargs -0 gh release upload "v$VERSION" --clobber
          # Fixed name so releases/latest/download/Leonidas-Setup.exe is one link that never changes.
          find artifacts -type f -name 'benchmark-*' -print0 | xargs -0 gh release upload "v$VERSION" --clobber
          cp "$(find artifacts -type f -name 'Leonidas-Code-*-x64.exe' | head -n 1)" artifacts/Leonidas-Setup.exe
          gh release upload "v$VERSION" artifacts/Leonidas-Setup.exe --clobber
          gh release edit "v$VERSION" --draft=false --latest
          echo "published=true" >> "$GITHUB_OUTPUT"

  health:
    name: Verify delivery and timings
    needs: [windows, publish]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Verify published assets and report slow or failed releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_PUBLISHED: ${{ needs.publish.outputs.published }}
        run: node scripts/leonidas-release-health.ts
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-health
          path: release-health.json
          retention-days: 90
