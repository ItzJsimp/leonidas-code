name: Team release

# Jake + Mob fork: every push to main builds the Windows installer and publishes it as a
# GitHub Release (version 1.0.<run_number>, plain semver so it lands on the "latest" update
# channel). The desktop app's own electron-updater polls this repo and shows the update toast.
# The upstream workflows are disabled in the repo's Actions settings (they need upstream
# runners and secrets); this is the only one that runs.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: team-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: 1.0.${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags, so the release notes can diff against the last release

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build JS bundle
        run: vp run build:desktop

      # No --wsl-runtime: it is optional and only powers the WSL backend. No signing: installs
      # show a one-time SmartScreen warning, updates still apply.
      - name: Build Windows installer
        run: vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "$VERSION" --skip-build --verbose

      # The release body is the app's "What's new" popup: one bullet per user-facing commit since
      # the previous release, oldest first (the app shows the newest first and keeps the last 8).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          RANGE=${PREV:+"$PREV..HEAD"}
          git log ${RANGE:--20} --no-merges --reverse --pretty=%s \
            | grep -viE '^(docs|chore|test|ci|sync|style)(\(|:)' \
            | sed -E 's/^[a-z]+(\([^)]*\))?!?: ?//; s/^(.)/- \u\1/' > notes.md || true
          [ -s notes.md ] || echo "- Behind-the-scenes improvements and fixes" > notes.md
          cat notes.md
          gh release create "v$VERSION" release/*.exe release/*.blockmap release/latest.yml \
            --title "v$VERSION" --notes-file notes.md --latest
