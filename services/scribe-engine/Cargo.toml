[package]
name = "scribe-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.18.2"
flacenc = { version = "0.5.1", default-features = false }
keyring = "4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
tiny_http = "0.12.0"
ureq = "3.4.2"
whisper-rs = "0.16.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tiny-skia = { version = "0.11.4", default-features = false, features = [
  "std",
  "simd",
  "png-format",
] }
